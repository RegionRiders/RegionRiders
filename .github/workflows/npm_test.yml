name: npm test

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  test_pull_request:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: regionriders
          POSTGRES_USER: regionriders_user
          POSTGRES_PASSWORD: regionriders_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: regionriders
      POSTGRES_USER: regionriders_user
      POSTGRES_PASSWORD: regionriders_pass
      OAUTH_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      OAUTH_ENCRYPTION_SALT: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'
      - name: Install dependencies
        run: corepack yarn
      - name: Run database migrations
        run: corepack yarn db:migrate
      - name: Run build
        run: corepack yarn build
      - name: Run tests
        run: corepack yarn test:all
